<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caesar Cipher</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        text-align: center;
        margin-top: 50px;
    }

    .container {
        width: 400px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    textarea, input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
    }

    p {
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Caesar Cipher Encryption & Decryption</h2>

    <textarea id="text" rows="4" placeholder="Enter text"></textarea>

    <input type="number" id="shift" value="3" placeholder="Shift Value">

    <br>

    <button onclick="encrypt()">Encrypt</button>
    <button onclick="decrypt()">Decrypt</button>

    <p id="encrypted"></p>
    <p id="decrypted"></p>
</div>

<script>
function caesarCipher(text, shift) {
    let result = "";

    for (let i = 0; i < text.length; i++) {
        let char = text[i];

        if (char >= 'A' && char <= 'Z') {
            result += String.fromCharCode(
                ((char.charCodeAt(0) - 65 + shift + 26) % 26) + 65
            );
        }
        else if (char >= 'a' && char <= 'z') {
            result += String.fromCharCode(
                ((char.charCodeAt(0) - 97 + shift + 26) % 26) + 97
            );
        }
        else {
            result += char;
        }
    }

    return result;
}

function encrypt() {
    let text = document.getElementById("text").value;
    let shift = parseInt(document.getElementById("shift").value);

    let encrypted = caesarCipher(text, shift);

    document.getElementById("encrypted").innerHTML =
        "Encrypted Text: " + encrypted;

    document.getElementById("decrypted").innerHTML = "";
}

function decrypt() {
    let text = document.getElementById("text").value;
    let shift = parseInt(document.getElementById("shift").value);

    let encrypted = caesarCipher(text, shift);
    let decrypted = caesarCipher(encrypted, -shift);

    document.getElementById("encrypted").innerHTML =
        "Encrypted Text: " + encrypted;

    document.getElementById("decrypted").innerHTML =
        "Decrypted Text: " + decrypted;
}
</script>

</body>
</html>
